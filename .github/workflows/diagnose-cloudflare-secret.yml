name: Diagnose Cloudflare Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Cloudflare Secrets (Both Tokens)
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          diagnose_secret() {
            local name="$1"
            local value="$2"
            echo "=== $name ==="
            printf '%s' "$value" | python3 -c "
import sys
data = sys.stdin.buffer.read()
print(f'Byte Length: {len(data)}')
try:
    text = data.decode('utf-8', errors='strict')
    print('Invalid UTF-8: NO')
    has_valid_utf8 = True
except UnicodeDecodeError:
    text = data.decode('utf-8', errors='replace')
    print('Invalid UTF-8: YES')
    has_valid_utf8 = False
if has_valid_utf8:
    print('Contains Real U+FFFD: YES' if '\ufffd' in text else 'Contains Real U+FFFD: NO')
else:
    print('Contains Real U+FFFD: N/A (invalid UTF-8)')
print(f'Char Length (decoded): {len(text)}')
has_non_ascii = any(b > 127 for b in data)
print('Contains non-ASCII: YES' if has_non_ascii else 'Contains non-ASCII: NO')
has_control = any(b in list(range(0,9)) + [11,12] + list(range(14,32)) + [127] for b in data)
print('Contains control chars: YES' if has_control else 'Contains control chars: NO')
ascii_space = ' \t\n\r\x0b\x0c'
has_leading_ascii = text[0] in ascii_space if text else False
has_trailing_ascii = text[-1] in ascii_space if text else False
print('Has leading ASCII space: YES' if has_leading_ascii else 'Has leading ASCII space: NO')
print('Has trailing ASCII space: YES' if has_trailing_ascii else 'Has trailing ASCII space: NO')
has_leading_unicode = text[0].isspace() if text else False
has_trailing_unicode = text[-1].isspace() if text else False
print('Has leading Unicode whitespace: YES' if has_leading_unicode else 'Has leading Unicode whitespace: NO')
print('Has trailing Unicode whitespace: YES' if has_trailing_unicode else 'Has trailing Unicode whitespace: NO')
"
          }

          diagnose_secret "CLOUDFLARE_API_TOKEN" "$TOKEN"
          echo ""
          diagnose_secret "CLOUDFLARE_ACCOUNT_ID" "$ACCOUNT"
