name: Diagnose Cloudflare Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare Secret safely
        env:
          SECRET_VALUE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$SECRET_VALUE" ]; then
            echo "CLOUDFLARE_API_TOKEN: EXISTS"
          else
            echo "CLOUDFLARE_API_TOKEN: MISSING"
          fi
          unset SECRET_VALUE
